services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: finnova-spec001-db
    environment:
      POSTGRES_DB: finnova
      POSTGRES_USER: finnova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare-local.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finnova_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnova -d finnova"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  finnova_postgres:
